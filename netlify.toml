# Temporary web deploy at app.fuelplan.fit, until real store builds exist
# (see CLAUDE.md's "Temporary web deploy" section and GitHub issue #18).
# Not wired to git-push auto-deploy — redeploy manually:
#   npx expo export --platform web
#   netlify deploy --prod --dir=dist
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
